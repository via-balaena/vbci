# The datasets and Wikidata items the warehouse loads, and whose they are. Each dataset is pinned
# by its zip's sha256 and length, and each Wikidata item by one revision's id and the sha256 and
# length of the content Wikidata stores for it: `cargo run -p balaena-warehouse -- fetch`
# downloads each into the cache under its pin, and the warehouse refuses bytes that differ, so
# a URL that starts serving other bytes stops the load instead of changing what is loaded. Read by
# crates/records (src/sources.rs).

[publisher.usda]
name = "U.S. Department of Agriculture, Agricultural Research Service: FoodData Central"
license = "CC0-1.0"
terms_url = "https://fdc.nal.usda.gov/api-guide.html"
terms_read = "2026-10-11"
# Quoted from terms_url, as read on terms_read.
terms = "USDA FoodData Central data are in the public domain and they are not copyrighted. They are published under CC0 1.0 Universal (CC0 1.0) No permission is needed for their use, but we request that users list FoodData Central as the source of the data, and when possible, notify us of the product that uses the data so we may better track how FDC is being used in the public domain."
# USDA's suggested citation, as the same page gives it; the page adds that release numbers and
# years change as new versions are released.
citation = "U.S. Department of Agriculture, Agricultural Research Service. FoodData Central, 2019. fdc.nal.usda.gov."

[publisher.wikidata]
name = "Wikidata"
license = "CC0-1.0"
terms_url = "https://www.wikidata.org/wiki/Wikidata:Licensing"
terms_read = "2026-10-16"
# Quoted from terms_url, as read on terms_read. The page asks for no citation, so none is given.
terms = "All structured data (i.e. the main, Property, Lexeme, and EntitySchema namespaces) is released into the public domain under Creative Commons Zero."

