[package]
name = "balaena-core"
version = "0.0.0"
description = "What VBCI's readers share: the export, read without a database"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# Without float_roundtrip, serde_json read a portion's grams per millilitre written as
# 0.9848334132725011 as 0.9848334132725012 (2026-10-12): the_export_reads_back_as_gold fails.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
