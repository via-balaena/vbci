names = ["sprig", "sprigs"]

[[unit]]
key = "stalk"
names = ["stalk", "stalks"]

[[unit]]
key = "slice"
names = ["slice", "slices"]

[[unit]]
key = "piece"
names = ["piece", "pieces"]

[[unit]]
key = "each"
names = ["each"]

[[unit]]
key = "small"
names = ["small"]

[[unit]]
key = "medium"
