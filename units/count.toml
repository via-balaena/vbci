# Count units: units a recipe counts in, which no mass or volume unit converts. cooklang's bundled
# units give the mass and volume units (gram, ounce, cup, tablespoon, fluid ounce, ...); these are
# the rest a recipe or USDA's portion text may name. A count unit's grams come from USDA's portion
# for the food, never from here. Each name is lowercase, names one unit, and is not a name of a
# mass or volume unit cooklang knows, or the warehouse refuses to load. Read by crates/records
# (src/units.rs).

[[unit]]
key = "clove"
names = ["clove", "cloves"]

[[unit]]
key = "bunch"
names = ["bunch", "bunches"]

[[unit]]
key = "head"
names = ["head", "heads"]

[[unit]]
key = "leaf"
