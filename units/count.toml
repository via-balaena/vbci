# Count units: units a recipe or USDA's portion text counts in, which no mass or volume unit
# converts. cooklang's bundled units give the mass and volume units (gram, ounce, cup, tablespoon,
# fluid ounce, ...). A count unit's grams come from USDA's portion for the food, never from here.
# Each name is lowercase with single spaces and names one unit, and no name is a unit cooklang
# knows, of mass, volume, length, temperature or time, or the warehouse refuses to load. Read by
# crates/records (src/units.rs).
#
# whole = true marks a unit one of which is one whole item of a food: a bare count, such as
# @onion{1}, is weighed by the food's USDA portions in the units marked so. A unit that names a
# part (clove, leaf, slice), several items (bunch) or a pack (can, package) is not marked.

[[unit]]
key = "clove"
names = ["clove", "cloves"]

[[unit]]
key = "bunch"
names = ["bunch", "bunches"]

[[unit]]
key = "head"
names = ["head", "heads"]
whole = true

[[unit]]
key = "leaf"
names = ["leaf", "leaves"]

[[unit]]
key = "sprig"
names = ["sprig", "sprigs"]

[[unit]]
key = "stalk"
names = ["stalk", "stalks"]

[[unit]]
key = "slice"
names = ["slice", "slices"]

[[unit]]
key = "piece"
names = ["piece", "pieces"]

[[unit]]
key = "each"
names = ["each"]
whole = true

[[unit]]
key = "small"
names = ["small"]
whole = true

[[unit]]
key = "medium"
names = ["medium"]
whole = true

[[unit]]
key = "large"
names = ["large"]
whole = true

[[unit]]
key = "fruit"
names = ["fruit", "fruits"]
whole = true

[[unit]]
key = "can"
names = ["can", "cans"]

[[unit]]
key = "package"
names = ["package", "packages"]

[[unit]]
key = "jar"
names = ["jar", "jars"]

[[unit]]
key = "pinch"
names = ["pinch", "pinches"]

[[unit]]
key = "dash"
names = ["dash", "dashes"]
