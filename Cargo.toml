[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/via-balaena/vbci"

# ring is the TLS crypto under ureq, which downloads USDA's zips. Measured on 2026-10-11, for SR
# Legacy's zip: a debug build failed the download with "unexpected end of file", after 258 s in a
# probe and after 8 min 48 s in fetch, where a release build took 2.8 s and 4.1 s. With ring alone
# optimized in debug builds, the probe took 15.4 s, and fetch downloaded both zips in 37.6 s. Why
# the optimization level matters here has not been isolated.
[profile.dev.package.ring]
opt-level = 3
