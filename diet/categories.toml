# The class of each of USDA's food categories, by its description exactly as USDA writes it. A
# category's class gives its foods' answers when no exception, naming rule or organism says
# otherwise:
#
#   plant          vegan yes,      vegetarian yes
#   dairy_and_egg  vegan no,       vegetarian yes
#   flesh          vegan no,       vegetarian no       (meat, poultry, fish and shellfish)
#   mixed          vegan unknown,  vegetarian unknown
#
# A plant category's food whose USDA name hides an animal ingredient is answered wrongly unless an
# exception or naming rule names it; its answer's basis says the answer came from the category.
# Every category of a dataset sources.toml pins has a class here, and each listed here is a category
# some dataset has, or the warehouse refuses to load. Read by crates/records (src/diet.rs).

[[category]]
description = "Dairy and Egg Products"
class = "dairy_and_egg"

[[category]]
description = "Spices and Herbs"
class = "plant"

[[category]]
description = "Baby Foods"
