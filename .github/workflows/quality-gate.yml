# The status check main's ruleset requires. The ruleset matches the job's
# `name:`, so renaming the job blocks every merge until the ruleset follows.
name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand, from the Actions tab or `gh workflow run "Quality Gate" --ref main`.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the gate's older run on it. Every other run is a
# concurrency group of its own, so no other run cancels it or holds it back.
concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    # DuckDB builds from source when the cache lacks it, once for clippy and once for the build the
    # fetch step and the tests share: main's run 38220150139, which built it a third time for the
    # tests, took 25 min 23 s. tentzhen's gate, which builds the same crate, allows 40 minutes.
    timeout-minutes: 40
    # The rules the gate's checks hold are listed in docs/architecture.md, "Rules".
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # One build for the fetch step and the tests. Built apart, by `cargo run` and `cargo test`,
      # they differed in serde_json's features (balaena-core, a dev-dependency, turns on
      # float_roundtrip), and each built DuckDB: main's run 38220150139 spent 7 min 20 s of its
      # test step on the second.
      - run: cargo build --workspace --bins --tests --locked
      # The warehouse's tests read USDA's zips from the cache; fetching refuses bytes that differ
      # from the sha256 sources.toml pins, so a cached zip is checked again on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vbci
          key: usda-${{ hashFiles('sources.toml') }}
          restore-keys: usda-
      - name: Fetch the zips sources.toml pins, with the binary the tests were built with
        run: target/debug/balaena-warehouse fetch
      - run: cargo test --workspace --locked
