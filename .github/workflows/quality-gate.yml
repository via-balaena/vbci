# The status check main's ruleset requires. The ruleset matches the job's
# `name:`, so renaming the job blocks every merge until the ruleset follows.
name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand, from the Actions tab or `gh workflow run "Quality Gate" --ref main`.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the gate's older run on it. Every other run is a
# concurrency group of its own, so no other run cancels it or holds it back.
concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    # DuckDB builds from source on a cold cache. tentzhen's gate, which builds the same crate, says
    # that takes about 17 minutes there, and allows 40.
    timeout-minutes: 40
    # The rules the gate's checks hold are listed in docs/architecture.md, "Rules".
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The warehouse's tests read USDA's zips from the cache; fetching refuses bytes that differ
      # from the sha256 sources.toml pins, so a cached zip is checked again on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vbci
          key: usda-${{ hashFiles('sources.toml') }}
          restore-keys: usda-
      - name: Fetch the zips sources.toml pins
        run: cargo run -q -p balaena-warehouse --locked -- fetch
      - run: cargo test --workspace --locked
